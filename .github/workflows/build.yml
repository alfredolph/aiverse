name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # windows runner 控制台默认 cp1252，中文 print 会 UnicodeEncodeError 把脚本搞崩
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 语法检查
        run: python -m compileall -q backend tools run.py build_exe.py

      - name: H3 生成链路（假 ComfyUI 端到端，全本地）
        run: python tools/test_h3_mock.py

      # 59 个接口逐个真调 + 5 组行为断言（资产化 / 队列暂停 / H3 状态自洽 …）。
      # 只看状态码会漏东西：曾经 59 个接口全返 200 的那一轮里，角色实体一条都没建出来。
      # 全本地，不下载任何东西，所以不标 continue-on-error。
      - name: API 全面巡检（59 接口 + 行为断言）
        run: python tools/test_api_surface.py

      # 真下载 17 MB 验证断点续传/解压。走公网镜像，偶发抖动不该拦发布，
      # 所以标了 continue-on-error —— 红了要去看日志，但不阻断出包。
      - name: 下载器完整性（真实下载 + 续传 + 解压）
        continue-on-error: true
        run: python tools/test_downloader.py

      # 部署器本体：真实下载 uv（17 MB）跑完 _run() 全程 ——
      # 下载 → 解压 → 落地 → exe 真执行 → state.json → 幂等跳过。
      # 只取计划里最小的那一步，不然要下 30 GB。同样走公网。
      - name: 部署器本体（_run 端到端，--skip-ffmpeg）
        continue-on-error: true
        run: python tools/test_deploy_slice.py --skip-ffmpeg

      # 剪辑导出：合成测试片段 → 真渲染 → ffprobe 校验产物。
      # 本机没有 ffmpeg 时它会自己用部署器装一份（约 92 MB）。
      # 这条就是为了防住「导出滤镜写错、但没显卡所以从没被执行到」那类问题。
      - name: 剪辑导出（真渲染 + ffprobe 校验）
        continue-on-error: true
        run: python tools/test_export.py

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build AIVerse.exe
        run: python build_exe.py

      - name: Smoke test（后端 API + 前端渲染）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/AIVerse.exe -ArgumentList '--no-open','8799' -PassThru
          Start-Sleep -Seconds 8
          try {
            $h = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/api/health' -UseBasicParsing -TimeoutSec 15
            Write-Host "health -> $($h.StatusCode) $($h.Content)"
            $s = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/api/runtime/status' -UseBasicParsing -TimeoutSec 15
            Write-Host "runtime/status -> $($s.StatusCode)"
            $pl = Invoke-WebRequest -Uri 'http://127.0.0.1:8799/api/runtime/plan?mirror=cn' -UseBasicParsing -TimeoutSec 30
            Write-Host "runtime/plan -> $($pl.StatusCode)"
            node tools/ui_smoke.js http://127.0.0.1:8799
            if ($LASTEXITCODE -ne 0) { throw "前端渲染冒烟测试失败" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer（AIVerse-Setup.exe）
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          & $iscc "installer\aiverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }
          Get-ChildItem installer\Output

      # 这条是补上来的：之前只测了「装得上」，没测「卸得干净」，
      # 结果卸载后 {app} 里会留一个 80 字节的 aiverse.ini 空目录。
      - name: 安装 / 卸载回归
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'av_install'
          $setup = Get-ChildItem installer\Output\AIVerse-Setup-*.exe | Select-Object -First 1
          Write-Host "安装 $($setup.Name) -> $dir"
          Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait

          $ini = Join-Path $dir 'aiverse.ini'
          if (-not (Test-Path $ini)) { throw "安装后没生成 aiverse.ini（安装版分流标记缺失）" }
          $text = Get-Content $ini -Raw
          if ($text -notmatch 'installed=1') { throw "aiverse.ini 内容不对：$text" }
          if (-not (Test-Path (Join-Path $dir 'AIVerse.exe'))) { throw "安装后没有 AIVerse.exe" }

          # Inno 的卸载器会把自己复制到 %TEMP% 再干活，原进程很快退出，
          # 所以 -Wait 靠不住，改成轮询等目录消失。
          Start-Process -FilePath (Join-Path $dir 'unins000.exe') `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path $dir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }

          if (Test-Path $dir) {
            $left = (Get-ChildItem $dir -Force | Select-Object -ExpandProperty Name) -join ', '
            throw "卸载后仍有残留：$left"
          }
          Write-Host "✓ 安装 -> 校验 aiverse.ini -> 卸载 -> 安装目录无残留"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIVerse-windows-x64
          path: |
            dist/AIVerse.exe
            installer/Output/AIVerse-Setup-*.exe
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AIVerse.exe
            installer/Output/AIVerse-Setup-*.exe
          generate_release_notes: true
          body: |
            ## 先看这里：为什么安装包只有 10 MB？

            打开安装包你会看到它很小。这不是缺东西，而是分工：

            | 组成 | 大小 | 装在哪 |
            |---|---|---|
            | **编排大脑**（本项目） | **约 10 MB** | 安装包里，双击即用 |
            | 剧本/角色/场景/分镜 Agent、审核门、抽卡、局部重生成、时间线、字幕、剪辑导出 | 同上 | 同上 |
            | **一键部署器**（自动装下面这一堆） | 同上 | 同上 |
            | Python 隔离环境 + PyTorch + CUDA | 约 2.5 GB | 首次部署时自动装 |
            | ComfyUI 执行引擎 | 约 2.4 GB | 首次部署时自动装 |
            | **MiniMax H3 权重（33B 参数，量化版）** | **26.4 GB** | 首次部署时自动下 |

            MiniMax H3 是 33B 参数的全模态视频模型，量化权重 26.4 GB（BF16 版 50+ GB）。
            没有任何办法把它压进 10 MB 的 exe —— 这不是取舍问题，是物理问题。
            ComfyUI Desktop、Pinokio、EZlaunch 等所有同类桌面应用，走的都是「小安装包 + 首次运行下载」。

            所以我们把「让用户自己去装」变成「点一下全自动装」，并额外提供**离线包**：

            | 你的情况 | 该怎么做 |
            |---|---|
            | 有网、有 N 卡 | 安装 → 点「⚡ 一键部署」→ 等 20~60 分钟 → 开始出片。全程只点一次 |
            | 没网 / 网慢 / 要给多台机器装 | 任意一台部署好 → 「📦 导出离线包」→ 拷 U 盘 → 其他机器「📥 导入离线包」，**零下载** |
            | 完全不想碰本地算力 | 装好后不部署，直接在「设置」里接云端 Provider（OpenAI 兼容 / 官方 H3 API） |

            **硬件门槛**：8 GB 显存能跑（慢但不崩）、12 GB 舒适、24 GB 随便跑；原生输出 768p。
            中文口播偏弱，建议用内置 TTS 走后期配音。

            ---

            首次启动会自动生成示例项目「示例 · 药铺里的秘密」并跑满全部 8 个阶段（约 2 秒），
            点开就能看到一条完整产线长什么样。

            两个附件：
            - `AIVerse.exe` —— 绿色版，双击即用，数据随 exe 走
            - `AIVerse-Setup-*.exe` —— 安装版，开始菜单/桌面快捷方式，卸载不删项目与模型
